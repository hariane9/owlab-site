  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    const siteStylesheet = doc.createElement('link');
    siteStylesheet.rel = 'stylesheet';
    siteStylesheet.href = new URL('style.css', window.location.href).href;
    doc.head.appendChild(siteStylesheet);
    // Use the high-resolution local logo instead of the legacy embedded JPEG.
    for (const img of Array.from(doc.querySelectorAll('img[alt="OWLAB"]'))) {
      img.setAttribute('src', new URL('assets/logo.png', window.location.href).href);
      img.style.objectFit = 'contain';
    }
    for (const icon of Array.from(doc.querySelectorAll('link[rel~="icon"]'))) {
      icon.setAttribute('href', new URL('assets/favicon.svg', window.location.href).href);
    }
    const sectionTop = doc.createElement('a');
    sectionTop.className = 'owlab-section-top';
    sectionTop.href = '#inicio';
    sectionTop.textContent = '↑ Voltar ao topo';
    sectionTop.title = 'Voltar ao topo';
    sectionTop.setAttribute('aria-label', 'Voltar ao topo');
    sectionTop.addEventListener('click', function(event) {
      event.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    doc.body.appendChild(sectionTop);
    const updateSectionTop = function() {
      const isSubsection = window.location.hash && window.location.hash !== '#inicio';
      sectionTop.classList.toggle('is-visible', isSubsection || window.scrollY > 260);
    };
    window.addEventListener('scroll', updateSectionTop, { passive: true });
    window.addEventListener('hashchange', updateSectionTop);
    updateSectionTop();
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ensed', sans-serif; font-weight: 600; margin: 0; }\n    p { margin: 0; text-wrap: pretty; }\n    a { color: #1A166A; text-decoration: none; }\n    a:hover { color: #3A3F43; }\n    table { border-collapse: collapse; width: 100%; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:#E4F2E1; color:#1A1B1E; overflow-x:hidden;\">\n\n  <!-- HEADER -->\n  <header style=\"position:sticky; top:0; z-index:50; background:rgba(228,242,225,0.93); backdrop-filter:blur(8px); border-bottom:1px solid rgba(26,22,106,0.15); display:flex; align-items:center; justify-content:space-between; padding:14px clamp(20px,5vw,56px); gap:16px;\">\n    <a href=\"#inicio\" style=\"display:flex; align-items:center; gap:10px;\">\n      <img src=\"4c208e2c-2de3-43f6-99f6-2bb3ad54dccc\" alt=\"OWLAB\" style=\"width:36px; height:36px; border-radius:6px; object-fit:cover;\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.02em; color:#1A166A;\">OWLAB<\u002Fspan>\n    <\u002Fa>\n    <nav style=\"display:flex; align-items:center; gap:clamp(10px,2vw,26px); flex-wrap:wrap;\">\n      <a href=\"#quem-somos\" style=\"font-size:14px; font-weight:700; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Quem Somos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Who We Are<\u002Fsc-if><\u002Fa>\n      <a href=\"#o-que-fazemos\" style=\"font-size:14px; font-weight:700; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">O Que Fazemos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">What We Do<\u002Fsc-if><\u002Fa>\n      <a href=\"#biblioteca\" style=\"font-size:14px; font-weight:700; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Biblioteca<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Library<\u002Fsc-if><\u002Fa>\n      <a href=\"#juntar\" style=\"font-size:14px; font-weight:700; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Junte-se a Nós<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Join Us<\u002Fsc-if><\u002Fa>\n      <a href=\"#contactos\" style=\"font-size:14px; font-weight:700; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Contactos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Contact<\u002Fsc-if><\u002Fa>\n      <button sc-camel-on-click=\"{{ toggleLang }}\" style=\"border:1px solid #1A166A; background:transparent; color:#1A166A; font-family:'Manrope',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.06em; padding:7px 12px; border-radius:4px; cursor:pointer;\" style-hover=\"background:#1A166A; color:#E4F2E1;\">\n        <sc-if value=\"{{ isPt }}\">EN<\u002Fsc-if><sc-if value=\"{{ isEn }}\">PT<\u002Fsc-if>\n      <\u002Fbutton>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section id=\"inicio\" data-screen-label=\"Início\" style=\"background:#1A166A; color:#E4F2E1; padding:clamp(64px,12vw,140px) clamp(20px,5vw,56px) clamp(56px,9vw,110px);\">\n    <div style=\"max-width:940px; margin:0 auto; text-align:center; animation:owlabFadeUp 0.9s ease both;\">\n      <div style=\"font-family:'Six Caps',sans-serif; font-size:26px; letter-spacing:0.14em; color:#B9C9B4; margin-bottom:18px;\">ONE WELFARE LAB<\u002Fdiv>\n      <h1 style=\"font-size:clamp(32px,5.4vw,58px); line-height:1.14; font-weight:600; margin-bottom:26px;\">\n        <sc-if value=\"{{ isPt }}\">\"A OWLAB não nasceu para produzir mais conhecimento. Nasceu para ajudar a sociedade a usar melhor o conhecimento que já existe.\"<\u002Fsc-if>\n        <sc-if value=\"{{ isEn }}\">\"OWLAB was not born to produce more knowledge. It was born to help society make better use of the knowledge that already exists.\"<\u002Fsc-if>\n      <\u002Fh1>\n      <div style=\"margin-bottom:40px;\">\n        <span style=\"border:1px solid rgba(228,242,225,0.4); border-radius:999px; padding:9px 20px; font-size:13px; font-weight:600; letter-spacing:0.04em;\">\n          <sc-if value=\"{{ isPt }}\">Ciência · Cidadania · Animais · Instituições<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">Science · Citizenship · Animals · Institutions<\u002Fsc-if>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:14px;\">\n        <a href=\"#quem-somos\" style=\"background:#E4F2E1; color:#1A166A; font-weight:700; font-size:14px; padding:13px 26px; border-radius:4px;\">\n          <sc-if value=\"{{ isPt }}\">Conhecer quem somos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Who we are<\u002Fsc-if>\n        <\u002Fa>\n        <a href=\"#o-que-fazemos\" style=\"border:1px solid #E4F2E1; color:#E4F2E1; font-weight:700; font-size:14px; padding:13px 26px; border-radius:4px;\">\n          <sc-if value=\"{{ isPt }}\">Ver o que fazemos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">See what we do<\u002Fsc-if>\n        <\u002Fa>\n        <a href=\"#juntar\" style=\"border:1px solid rgba(228,242,225,0.5); color:#E4F2E1; font-weight:700; font-size:14px; padding:13px 26px; border-radius:4px;\">\n          <sc-if value=\"{{ isPt }}\">Junte-se a nós<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Join us<\u002Fsc-if>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- IMAGE BAND -->\n  <div style=\"width:100%; height:clamp(220px,32vw,380px);\">\n    <image-slot id=\"img-hero-band\" shape=\"rect\" placeholder=\"Fotografia — equipa OWLAB / sessão de trabalho\" src=\"9ec1331d-f205-4268-ad3a-3e381e25c050\"><\u002Fimage-slot>\n  <\u002Fdiv>\n\n  <!-- PORQUE EXISTIMOS -->\n  <section style=\"padding:clamp(64px,10vw,120px) clamp(20px,5vw,56px);\">\n    <div style=\"max-width:1080px; margin:0 auto;\">\n      <div style=\"font-family:'Six Caps',sans-serif; font-size:22px; letter-spacing:0.14em; color:#1A166A; margin-bottom:12px;\">\n        <sc-if value=\"{{ isPt }}\">PORQUE EXISTIMOS<\u002Fsc-if><sc-if value=\"{{ isEn }}\">WHY WE EXIST<\u002Fsc-if>\n      <\u002Fdiv>\n      <h2 style=\"font-size:clamp(28px,4vw,42px); font-weight:600; color:#1A166A; margin-bottom:28px; max-width:760px;\">\n        <sc-if value=\"{{ isPt }}\">Porque existe a OWLAB<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Why OWLAB exists<\u002Fsc-if>\n      <\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:32px; margin-bottom:36px;\">\n        <p style=\"font-size:16px; line-height:1.7; color:#3A3F43;\">\n          <sc-if value=\"{{ isPt }}\">Portugal tem conhecimento científico, experiência profissional, instituições e uma sociedade civil cada vez mais atenta aos desafios que ligam pessoas, animais e ambiente. Esse conhecimento permanece, no entanto, muitas vezes disperso entre disciplinas, setores e organizações. A OWLAB nasce para responder a essa lacuna.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">Portugal has scientific knowledge, professional experience, institutions and a civil society increasingly attentive to the challenges linking people, animals and the environment. Yet that knowledge often remains scattered across disciplines, sectors and organisations. OWLAB was created to respond to that gap.<\u002Fsc-if>\n        <\u002Fp>\n        <p style=\"font-size:16px; line-height:1.7; color:#3A3F43;\">\n          <sc-if value=\"{{ isPt }}\">Juridicamente, será constituída como associação portuguesa sem fins lucrativos. Institucionalmente, é pensada como uma infraestrutura cívica de integração de conhecimento, experimentação e tradução de conhecimento em políticas públicas.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">Legally, it will be constituted as a Portuguese non-profit association. Institutionally, it is designed as a civic infrastructure for integrating knowledge, experimentation and translating knowledge into public policy.<\u002Fsc-if>\n        <\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#1A166A; border-radius:4px; padding:28px 30px; margin-bottom:28px;\">\n        <div style=\"font-family:'Six Caps',sans-serif; font-size:18px; letter-spacing:0.1em; color:#B9C9B4; margin-bottom:10px;\">\n          <sc-if value=\"{{ isPt }}\">POSICIONAMENTO<\u002Fsc-if><sc-if value=\"{{ isEn }}\">POSITIONING<\u002Fsc-if>\n        <\u002Fdiv>\n        <p style=\"font-size:15px; line-height:1.65; color:#E4F2E1;\">\n          <sc-if value=\"{{ isPt }}\">A OWLAB não substitui universidades, entidades públicas, associações, empresas ou decisores. Liga quem produz conhecimento, quem conhece a realidade no terreno, quem é afetado pelas decisões, e quem tem a responsabilidade de decidir.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">OWLAB does not replace universities, public bodies, associations, companies or policymakers. It connects those who produce knowledge, those who know the reality on the ground, those affected by decisions, and those responsible for deciding.<\u002Fsc-if>\n        <\u002Fp>\n      <\u002Fdiv>\n      <p style=\"font-family:'Barlow Condensed',sans-serif; font-weight:500; font-style:italic; font-size:clamp(18px,2.2vw,22px); line-height:1.5; color:#1A166A; max-width:840px;\">\n        <sc-if value=\"{{ isPt }}\">A OWLAB existe para transformar conhecimento disperso — científico, cidadão, profissional e institucional — em compreensão partilhada e em decisões públicas mais robustas.<\u002Fsc-if>\n        <sc-if value=\"{{ isEn }}\">OWLAB exists to turn scattered knowledge — scientific, civic, professional and institutional — into shared understanding and more robust public decisions.<\u002Fsc-if>\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- QUEM SOMOS -->\n  <section id=\"quem-somos\" data-screen-label=\"Quem Somos\" style=\"background:#1A166A; color:#E4F2E1; padding:clamp(64px,10vw,120px) clamp(20px,5vw,56px);\">\n    <div style=\"max-width:1080px; margin:0 auto;\">\n      <div style=\"font-family:'Six Caps',sans-serif; font-size:22px; letter-spacing:0.14em; color:#B9C9B4; margin-bottom:12px;\">\n        <sc-if value=\"{{ isPt }}\">QUEM SOMOS<\u002Fsc-if><sc-if value=\"{{ isEn }}\">WHO WE ARE<\u002Fsc-if>\n      <\u002Fdiv>\n      <p style=\"font-size:clamp(18px,2.4vw,24px); line-height:1.55; max-width:840px; margin-bottom:56px;\">\n        <sc-if value=\"{{ isPt }}\">A OWLAB é uma estrutura de inteligência pública e inovação colaborativa que integra conhecimento científico, experiência profissional, participação cidadã e capacidade institucional, para testar soluções e contribuir para políticas públicas mais robustas, adaptativas e coerentes com a interdependência entre pessoas, animais e ambiente.<\u002Fsc-if>\n        <sc-if value=\"{{ isEn }}\">OWLAB is a structure for public intelligence and collaborative innovation that integrates scientific knowledge, professional experience, citizen participation and institutional capacity, to test solutions and contribute to public policies that are more robust, adaptive and coherent with the interdependence between people, animals and the environment.<\u002Fsc-if>\n      <\u002Fp>\n\n      <div data-reveal=\"1\" style=\"margin-bottom:56px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n        <h3 style=\"font-size:clamp(24px,3vw,32px); margin-bottom:14px;\"><sc-if value=\"{{ isPt }}\">A nossa visão<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Our vision<\u002Fsc-if><\u002Fh3>\n        <p style=\"font-size:16px; line-height:1.7; color:#D8E4D5; max-width:800px; margin-bottom:14px;\">\n          <sc-if value=\"{{ isPt }}\">Juntar sociedade, ciência, instituições e animais numa linguagem comum — a linguagem One Welfare — e transformar essa integração em inteligência pública: conhecimento organizado ao serviço de decisões melhores.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">To bring together society, science, institutions and animals in a common language — the One Welfare language — and turn that integration into public intelligence: organised knowledge in service of better decisions.<\u002Fsc-if>\n        <\u002Fp>\n        <p style=\"font-style:italic; font-size:14.5px; line-height:1.6; color:#B9C9B4; max-width:800px; margin-bottom:32px;\">\n          <sc-if value=\"{{ isPt }}\">One Welfare: paradigma que reconhece que o bem-estar humano, o bem-estar animal e a saúde do ambiente estão interligados e devem ser compreendidos e geridos em conjunto, e não como assuntos separados.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">One Welfare: a paradigm recognising that human welfare, animal welfare and environmental health are interconnected and must be understood and managed together, not as separate matters.<\u002Fsc-if>\n        <\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:20px;\">\n          <div style=\"border:1px solid rgba(228,242,225,0.3); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Sociedade + Ciência + Instituições + Animais<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Society + Science + Institutions + Animals<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">As quatro fontes de conhecimento que a OWLAB liga.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">The four knowledge sources OWLAB connects.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(228,242,225,0.3); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Uma linguagem comum: One Welfare<\u002Fsc-if><sc-if value=\"{{ isEn }}\">A common language: One Welfare<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">O ponto de encontro entre essas quatro fontes.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">The meeting point between those four sources.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid rgba(228,242,225,0.3); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Inteligência pública<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Public intelligence<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">O resultado que a OWLAB entrega à sociedade.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">The outcome OWLAB delivers to society.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"border-top:1px solid rgba(228,242,225,0.25); padding-top:40px; margin-bottom:56px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n        <h3 style=\"font-size:clamp(24px,3vw,32px); margin-bottom:14px;\"><sc-if value=\"{{ isPt }}\">A nossa missão<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Our mission<\u002Fsc-if><\u002Fh3>\n        <p style=\"font-size:16px; line-height:1.7; color:#D8E4D5; max-width:820px; margin-bottom:14px;\">\n          <sc-if value=\"{{ isPt }}\">Criar condições permanentes para que ciência, cidadania, experiência prática, instituições e informação vinda dos animais interajam de forma estruturada — transformando conhecimento disperso em compreensão partilhada e em soluções públicas mais robustas.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">To create permanent conditions for science, citizenship, practical experience, institutions and information from animals to interact in a structured way — turning scattered knowledge into shared understanding and more robust public solutions.<\u002Fsc-if>\n        <\u002Fp>\n        <p style=\"font-size:14.5px; line-height:1.65; color:#B9C9B4; max-width:820px;\">\n          <sc-if value=\"{{ isPt }}\">Concretamente: a OWLAB não substitui universidades, entidades públicas, associações, empresas ou decisores. Liga quem produz conhecimento, quem conhece a realidade no terreno, quem é afetado pelas decisões, e quem tem a responsabilidade de decidir.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">Concretely: OWLAB does not replace universities, public bodies, associations, companies or policymakers. It connects those who produce knowledge, those who know the reality on the ground, those affected by decisions, and those responsible for deciding.<\u002Fsc-if>\n        <\u002Fp>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"border-top:1px solid rgba(228,242,225,0.25); padding-top:40px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n        <h3 style=\"font-size:clamp(24px,3vw,32px); margin-bottom:24px;\"><sc-if value=\"{{ isPt }}\">Os nossos valores<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Our values<\u002Fsc-if><\u002Fh3>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:22px;\">\n          <div><div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Transparência e independência<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Transparency and independence<\u002Fsc-if><\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.6; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">Parceiros e financiamento diversificados, declaração transparente de interesses, métodos abertos, decisões documentadas e autonomia institucional protegida de influências indevidas.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Diversified partners and funding, transparent declaration of interests, open methods, documented decisions and institutional autonomy protected from undue influence.<\u002Fsc-if><\u002Fp><\u002Fdiv>\n          <div><div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Rigor científico<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Scientific rigour<\u002Fsc-if><\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.6; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">Evidência qualificada, critérios explícitos e revisão crítica de métodos e resultados.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Qualified evidence, explicit criteria and critical review of methods and results.<\u002Fsc-if><\u002Fp><\u002Fdiv>\n          <div><div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Pluralidade<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Plurality<\u002Fsc-if><\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.6; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">Integração equilibrada de perspetivas, disciplinas, pontos de vista institucionais e conhecimento experiencial diversos. Os argumentos são considerados pela qualidade do seu raciocínio, evidência de suporte e relevância.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Balanced integration of perspectives, disciplines, institutional viewpoints and diverse experiential knowledge. Arguments are weighed by the quality of their reasoning, supporting evidence and relevance.<\u002Fsc-if><\u002Fp><\u002Fdiv>\n          <div><div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Participação com significado<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Meaningful participation<\u002Fsc-if><\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.6; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">Os cidadãos contribuem ativamente para a aprendizagem, a deliberação e a co-criação de recomendações, com influência real nos resultados.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Citizens contribute actively to learning, deliberation and the co-creation of recommendations, with real influence on outcomes.<\u002Fsc-if><\u002Fp><\u002Fdiv>\n          <div><div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Aprendizagem contínua<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Continuous learning<\u002Fsc-if><\u002Fdiv>\n            <p style=\"font-size:14px; line-height:1.6; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">Cada projeto gera avaliação, aprendizagem institucional e melhoria metodológica.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Every project generates evaluation, institutional learning and methodological improvement.<\u002Fsc-if><\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- O QUE FAZEMOS -->\n  <section id=\"o-que-fazemos\" data-screen-label=\"O Que Fazemos\" style=\"padding:clamp(64px,10vw,120px) clamp(20px,5vw,56px);\">\n    <div style=\"max-width:1080px; margin:0 auto;\">\n      <div style=\"font-family:'Six Caps',sans-serif; font-size:22px; letter-spacing:0.14em; color:#1A166A; margin-bottom:12px;\">\n        <sc-if value=\"{{ isPt }}\">O QUE FAZEMOS<\u002Fsc-if><sc-if value=\"{{ isEn }}\">WHAT WE DO<\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div id=\"living-lab\" style=\"margin-bottom:64px;\">\n        <h2 style=\"font-size:clamp(28px,4vw,42px); color:#1A166A; margin-bottom:18px;\">Living Labs<\u002Fh2>\n        <p style=\"font-size:16px; line-height:1.7; color:#3A3F43; max-width:800px; margin-bottom:32px;\">\n          <sc-if value=\"{{ isPt }}\">Os Living Labs são laboratórios colaborativos temporários, criados em torno de desafios públicos concretos. Reúnem cidadãos, investigadores, profissionais, organizações, instituições e decisores, para testar o método OWLAB em condições reais.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">Living Labs are temporary collaborative laboratories, built around concrete public challenges. They bring together citizens, researchers, professionals, organisations, institutions and policymakers to test the OWLAB method under real conditions.<\u002Fsc-if>\n        <\u002Fp>\n        <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:24px; margin-bottom:32px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n          <div><div style=\"width:34px; height:34px; border:1px solid #1A166A; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#1A166A; margin-bottom:12px;\">1<\u002Fdiv>\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:4px;\"><sc-if value=\"{{ isPt }}\">Ouvir<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Listen<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:14px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Necessidades, experiências e sinais.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Needs, experiences and signals.<\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:34px; height:34px; border:1px solid #1A166A; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#1A166A; margin-bottom:12px;\">2<\u002Fdiv>\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:4px;\"><sc-if value=\"{{ isPt }}\">Integrar<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Integrate<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:14px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Evidência e diferentes perspetivas.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Evidence and different perspectives.<\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:34px; height:34px; border:1px solid #1A166A; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#1A166A; margin-bottom:12px;\">3<\u002Fdiv>\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:4px;\"><sc-if value=\"{{ isPt }}\">Construir<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Build<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:14px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Recomendações e soluções.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Recommendations and solutions.<\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"width:34px; height:34px; border:1px solid #1A166A; border-radius:4px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#1A166A; margin-bottom:12px;\">4<\u002Fdiv>\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:4px;\"><sc-if value=\"{{ isPt }}\">Aprender<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Learn<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:14px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Avaliação, transparência e adaptação.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Evaluation, transparency and adaptation.<\u002Fsc-if><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid rgba(26,22,106,0.18); border-radius:4px; padding:32px; margin-bottom:32px;\">\n          <div style=\"width:100%; height:clamp(160px,22vw,260px); margin-bottom:24px;\">\n            <image-slot id=\"img-projeto-farol\" shape=\"rounded\" radius=\"4\" placeholder=\"Fotografia — Living Lab / Direito Animal\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"font-family:'Six Caps',sans-serif; font-size:18px; letter-spacing:0.1em; color:#6B6E74; margin-bottom:8px;\">\n            <sc-if value=\"{{ isPt }}\">PRIMEIRO LIVING LAB<\u002Fsc-if><sc-if value=\"{{ isEn }}\">FIRST LIVING LAB<\u002Fsc-if>\n          <\u002Fdiv>\n          <h3 style=\"font-size:clamp(20px,2.6vw,26px); color:#1A166A; margin-bottom:14px;\">\n            <sc-if value=\"{{ isPt }}\">A Iniciativa Legislativa de Cidadãos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">The Citizens' Legislative Initiative<\u002Fsc-if>\n          <\u002Fh3>\n          <p style=\"font-size:15px; line-height:1.65; color:#3A3F43; margin-bottom:16px;\">\n            <sc-if value=\"{{ isPt }}\">A Iniciativa Legislativa de Cidadãos para a Reforma do Direito Animal em Portugal é a primeira aplicação prática do modelo, um objeto concreto, interdisciplinar e socialmente relevante, capaz de testar um ciclo completo de integração de conhecimento, deliberação, tradução jurídica e avaliação.<\u002Fsc-if>\n            <sc-if value=\"{{ isEn }}\">The Citizens' Legislative Initiative for the Reform of Animal Law in Portugal is the first practical application of the model — a concrete, interdisciplinary and socially relevant case, able to test a complete cycle of knowledge integration, deliberation, legal translation and evaluation.<\u002Fsc-if>\n          <\u002Fp>\n          <p style=\"font-size:14px; line-height:1.6; color:#6B6E74; font-style:italic;\">\n            <sc-if value=\"{{ isPt }}\">Desenho deliberativo de referência: inspirado na Citizens' Initiative Review, reunindo um painel representativo de cidadãos para examinar a proposta legislativa, ouvir proponentes, críticos e especialistas independentes, e produzir uma declaração cidadã com os factos verificados e os argumentos mais fortes de cada perspetiva.<\u002Fsc-if>\n            <sc-if value=\"{{ isEn }}\">Reference deliberative design: inspired by the Citizens' Initiative Review, gathering a representative citizen panel to examine the legislative proposal, hear proponents, critics and independent experts, and produce a citizen statement with verified facts and the strongest arguments from each perspective.<\u002Fsc-if>\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"forums\" style=\"margin-bottom:64px;\">\n        <h2 style=\"font-size:clamp(28px,4vw,42px); color:#1A166A; margin-bottom:18px;\"><sc-if value=\"{{ isPt }}\">Fóruns Cidadãos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Citizen Forums<\u002Fsc-if><\u002Fh2>\n        <p style=\"font-size:16px; line-height:1.7; color:#3A3F43; max-width:820px; margin-bottom:24px;\">\n          <sc-if value=\"{{ isPt }}\">Os Fóruns Cidadãos são os espaços de participação abertos da OWLAB — encontros onde diferentes interlocutores se juntam para debater problemas societais concretos, não disciplinas isoladas. Ao contrário de um Living Lab, os Fóruns são o canal permanente através do qual qualquer cidadão pode contribuir, ser ouvido e, quando aplicável, participar em votações ou consultas sobre propostas em debate.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">Citizen Forums are OWLAB's open participation spaces — gatherings where different voices come together to debate concrete societal problems, not isolated disciplines. Unlike a Living Lab, Forums are the permanent channel through which any citizen can contribute, be heard and, when applicable, take part in votes or consultations on proposals under debate.<\u002Fsc-if>\n        <\u002Fp>\n        <div style=\"background:#F0EFE3; border-radius:4px; padding:28px 30px;\">\n          <p style=\"font-size:14.5px; line-height:1.6; color:#3A3F43; margin-bottom:16px;\">\n            <sc-if value=\"{{ isPt }}\">Quando o tema justifica uma deliberação formal, a OWLAB segue critérios que distinguem um processo deliberativo genuíno de uma simples consulta, com base na prática internacional (Citizens' Initiative Review; OCDE, Catching the Deliberative Wave, 2020):<\u002Fsc-if>\n            <sc-if value=\"{{ isEn }}\">When the topic justifies a formal deliberation, OWLAB follows criteria that distinguish a genuine deliberative process from a simple consultation, based on international practice (Citizens' Initiative Review; OECD, Catching the Deliberative Wave, 2020):<\u002Fsc-if>\n          <\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n            <sc-if value=\"{{ isPt }}\">\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Representatividade<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Tempo e informação suficientes<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Raciocínio baseado em evidência<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Facilitação independente<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Mandato e influência reais<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Transparência e avaliação<\u002Fspan>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ isEn }}\">\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Representativeness<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Sufficient time and information<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Evidence-based reasoning<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Independent facilitation<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Real mandate and influence<\u002Fspan>\n              <span style=\"background:#FFFFFF; border:1px solid rgba(26,22,106,0.2); border-radius:999px; padding:7px 15px; font-size:13px; font-weight:600; color:#1A166A;\">Transparency and evaluation<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"observatorio\" style=\"margin-bottom:64px;\">\n        <h2 style=\"font-size:clamp(28px,4vw,42px); color:#1A166A; margin-bottom:18px;\"><sc-if value=\"{{ isPt }}\">Observatório<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Observatory<\u002Fsc-if><\u002Fh2>\n        <p style=\"font-size:16px; line-height:1.7; color:#3A3F43; max-width:820px; margin-bottom:32px;\">\n          <sc-if value=\"{{ isPt }}\">A OWLAB pretende disponibilizar, num único lugar, informação hoje dispersa, desatualizada ou simplesmente inexistente sobre a relação entre sociedade, animais e ambiente — uma rede própria de dados e estatísticas, à semelhança de um censo. O objetivo é duplo: informar o público de forma acessível, e dar às propostas de política pública uma base de evidência difícil de ignorar. O desenvolvimento será faseado e dependente de dados oficiais e de protocolos com entidades competentes.<\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">OWLAB aims to gather, in one place, information that today is scattered, outdated or simply non-existent about the relationship between society, animals and the environment — a data and statistics network of its own, akin to a census. The goal is twofold: to inform the public accessibly, and to give public policy proposals an evidence base that is hard to ignore. Development will be phased and dependent on official data and protocols with competent bodies.<\u002Fsc-if>\n        <\u002Fp>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:18px;\">\n          <div style=\"border:1px dashed rgba(26,22,106,0.35); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Animais de companhia<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Companion animals<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Registos, abandono, CRO, associações, abrigos e esterilização, animais errantes.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Registries, abandonment, shelters, associations, sterilisation, stray animals.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px dashed rgba(26,22,106,0.35); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Animais de pecuária<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Farm animals<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Sistemas produtivos, efetivos, volumes e indicadores de bem-estar.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Production systems, herd sizes, volumes and welfare indicators.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px dashed rgba(26,22,106,0.35); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Fauna selvagem<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Wildlife<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Centros de recuperação, ocorrências, resgates e corredores ecológicos.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Recovery centres, incidents, rescues and ecological corridors.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px dashed rgba(26,22,106,0.35); border-radius:4px; padding:20px;\">\n            <div style=\"font-weight:700; color:#1A166A; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Políticas públicas<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Public policy<\u002Fsc-if><\u002Fdiv>\n            <div style=\"font-size:13.5px; color:#3A3F43;\"><sc-if value=\"{{ isPt }}\">Diplomas, medidas, execução, fiscalização e lacunas territoriais.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Statutes, measures, implementation, oversight and territorial gaps.<\u002Fsc-if><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div id=\"parcerias\">\n        <h2 style=\"font-size:clamp(28px,4vw,42px); color:#1A166A; margin-bottom:18px;\"><sc-if value=\"{{ isPt }}\">Parcerias<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Partnerships<\u002Fsc-if><\u002Fh2>\n        <p style=\"font-size:15px; line-height:1.6; color:#3A3F43; margin-bottom:20px;\"><sc-if value=\"{{ isPt }}\">Quem pode participar:<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Who can take part:<\u002Fsc-if><\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n          <sc-if value=\"{{ isPt }}\">\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Investigadores, universidades e centros de investigação<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Profissionais e especialistas<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Organizações da sociedade civil<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Administrações públicas e decisores<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Fundações, financiadores e parceiros de inovação<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Cidadãos interessados em contribuir<\u002Fspan>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ isEn }}\">\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Researchers, universities and research centres<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Professionals and specialists<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Civil society organisations<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Public administrations and policymakers<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Foundations, funders and innovation partners<\u002Fspan>\n            <span style=\"border:1px solid rgba(26,22,106,0.25); border-radius:999px; padding:8px 16px; font-size:13.5px; color:#1A166A;\">Citizens interested in contributing<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- BIBLIOTECA -->\n  <section id=\"biblioteca\" data-screen-label=\"Biblioteca\" style=\"background:#3A3F43; color:#E4F2E1; padding:clamp(64px,10vw,120px) clamp(20px,5vw,56px);\">\n    <div style=\"max-width:1080px; margin:0 auto;\">\n      <div style=\"font-family:'Six Caps',sans-serif; font-size:22px; letter-spacing:0.14em; color:#C9CBCE; margin-bottom:12px;\">\n        <sc-if value=\"{{ isPt }}\">BIBLIOTECA<\u002Fsc-if><sc-if value=\"{{ isEn }}\">LIBRARY<\u002Fsc-if>\n      <\u002Fdiv>\n      <h2 style=\"font-size:clamp(28px,4vw,42px); margin-bottom:16px; max-width:760px;\">\n        <sc-if value=\"{{ isPt }}\">Biblioteca digital<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Digital library<\u002Fsc-if>\n      <\u002Fh2>\n      <p style=\"font-size:16px; line-height:1.65; color:#D4D5D8; max-width:800px; margin-bottom:40px;\">\n        <sc-if value=\"{{ isPt }}\">Acesso público e organizado a todo o conhecimento e propostas produzidas — artigos, revisões, livros, revistas e relatórios — para público académico e não académico.<\u002Fsc-if>\n        <sc-if value=\"{{ isEn }}\">Public, organised access to all the knowledge and proposals produced — articles, reviews, books, journals and reports — for academic and non-academic audiences alike.<\u002Fsc-if>\n      <\u002Fp>\n      <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; margin-bottom:32px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n        <div style=\"border:1px solid rgba(228,242,225,0.25); border-radius:4px; padding:20px;\">\n          <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Cadernos de Reflexão One Welfare<\u002Fsc-if><sc-if value=\"{{ isEn }}\">One Welfare Reflection Papers<\u002Fsc-if><\u002Fdiv>\n          <div style=\"font-size:12px; color:#AEB0B4; font-weight:700; letter-spacing:0.06em;\"><sc-if value=\"{{ isPt }}\">EM BREVE<\u002Fsc-if><sc-if value=\"{{ isEn }}\">COMING SOON<\u002Fsc-if><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(228,242,225,0.25); border-radius:4px; padding:20px;\">\n          <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Sínteses para Decisores Públicos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Syntheses for Policymakers<\u002Fsc-if><\u002Fdiv>\n          <div style=\"font-size:12px; color:#AEB0B4; font-weight:700; letter-spacing:0.06em;\"><sc-if value=\"{{ isPt }}\">EM BREVE<\u002Fsc-if><sc-if value=\"{{ isEn }}\">COMING SOON<\u002Fsc-if><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(228,242,225,0.25); border-radius:4px; padding:20px;\">\n          <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Relatórios Técnicos<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Technical Reports<\u002Fsc-if><\u002Fdiv>\n          <div style=\"font-size:12px; color:#AEB0B4; font-weight:700; letter-spacing:0.06em;\"><sc-if value=\"{{ isPt }}\">EM BREVE<\u002Fsc-if><sc-if value=\"{{ isEn }}\">COMING SOON<\u002Fsc-if><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(228,242,225,0.25); border-radius:4px; padding:20px;\">\n          <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Guias e Cadernos de Cidadania<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Citizenship Guides<\u002Fsc-if><\u002Fdiv>\n          <div style=\"font-size:12px; color:#AEB0B4; font-weight:700; letter-spacing:0.06em;\"><sc-if value=\"{{ isPt }}\">EM BREVE<\u002Fsc-if><sc-if value=\"{{ isEn }}\">COMING SOON<\u002Fsc-if><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid rgba(228,242,225,0.25); border-radius:4px; padding:20px;\">\n          <div style=\"font-weight:700; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">Materiais de Formação<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Training Materials<\u002Fsc-if><\u002Fdiv>\n          <div style=\"font-size:12px; color:#AEB0B4; font-weight:700; letter-spacing:0.06em;\"><sc-if value=\"{{ isPt }}\">EM BREVE<\u002Fsc-if><sc-if value=\"{{ isEn }}\">COMING SOON<\u002Fsc-if><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px; color:#B4B6B9;\">\n        <sc-if value=\"{{ isPt }}\">A biblioteca está a ser construída. Os primeiros documentos serão publicados após a constituição formal da associação.<\u002Fsc-if>\n        <sc-if value=\"{{ isEn }}\">The library is being built. The first documents will be published once the association is formally constituted.<\u002Fsc-if>\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- JUNTE-SE A NOS -->\n  <section id=\"juntar\" data-screen-label=\"Junte-se a Nós\" style=\"padding:clamp(64px,10vw,120px) clamp(20px,5vw,56px);\">\n    <div style=\"max-width:1080px; margin:0 auto;\">\n      <div style=\"font-family:'Six Caps',sans-serif; font-size:22px; letter-spacing:0.14em; color:#1A166A; margin-bottom:12px;\">\n        <sc-if value=\"{{ isPt }}\">JUNTE-SE A NÓS<\u002Fsc-if><sc-if value=\"{{ isEn }}\">JOIN US<\u002Fsc-if>\n      <\u002Fdiv>\n      <h2 style=\"font-size:clamp(26px,3.6vw,38px); color:#1A166A; line-height:1.25; max-width:840px; margin-bottom:44px;\">\n        <sc-if value=\"{{ isPt }}\">\"A OWLAB não procura dizer à sociedade o que pensar. Procura criar as condições para que a sociedade compreenda melhor, aprenda coletivamente e construa políticas mais inteligentes, participativas e adaptativas — e isso só é possível com quem se juntar a nós.\"<\u002Fsc-if>\n        <sc-if value=\"{{ isEn }}\">\"OWLAB does not seek to tell society what to think. It seeks to create the conditions for society to understand better, learn collectively and build smarter, more participatory and adaptive policies — and that is only possible with those who join us.\"<\u002Fsc-if>\n      <\u002Fh2>\n\n      <div style=\"width:100%; height:clamp(180px,24vw,300px); margin-bottom:40px;\">\n        <image-slot id=\"img-juntar\" shape=\"rounded\" radius=\"4\" placeholder=\"Fotografia — comunidade / núcleo fundador\"><\u002Fimage-slot>\n      <\u002Fdiv>\n\n      <div data-reveal=\"1\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n        <div id=\"instituicao\" style=\"border:1px solid rgba(26,22,106,0.18); border-radius:4px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <h4 style=\"font-size:19px; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Para Instituições<\u002Fsc-if><sc-if value=\"{{ isEn }}\">For Institutions<\u002Fsc-if><\u002Fh4>\n          <p style=\"font-size:12.5px; font-weight:700; color:#6B6E74; letter-spacing:0.02em;\"><sc-if value=\"{{ isPt }}\">Universidades, associações, administrações públicas, empresas e fundações.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Universities, associations, public administrations, companies and foundations.<\u002Fsc-if><\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.55; color:#3A3F43; flex:1;\"><sc-if value=\"{{ isPt }}\">Se representa uma instituição interessada em colaborar com a OWLAB — num Living Lab, numa candidatura conjunta ou numa parceria de conhecimento — contacte-nos através da nossa ficha de contacto institucional.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">If you represent an institution interested in collaborating with OWLAB — in a Living Lab, a joint application, or a knowledge partnership — reach out through our institutional contact form.<\u002Fsc-if><\u002Fp>\n          <a href=\"mailto:geral@owlab.pt\" style=\"font-size:13px; font-weight:700; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Torne-se parceiro institucional →<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Become an institutional partner →<\u002Fsc-if><\u002Fa>\n        <\u002Fdiv>\n        <div id=\"decisores\" style=\"border:1px solid rgba(26,22,106,0.18); border-radius:4px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <h4 style=\"font-size:19px; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Decisores e Juristas<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Policymakers and Lawyers<\u002Fsc-if><\u002Fh4>\n          <p style=\"font-size:12.5px; font-weight:700; color:#6B6E74;\"><sc-if value=\"{{ isPt }}\">Deputados, autarcas, técnicos da administração pública, advogados e juristas.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">MPs, local officials, public servants, lawyers and legal professionals.<\u002Fsc-if><\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.55; color:#3A3F43; flex:1;\"><sc-if value=\"{{ isPt }}\">A OWLAB produz policy briefs, sínteses e propostas de melhoria regulatória. Acompanhe o nosso trabalho legislativo, a começar pela Iniciativa Legislativa de Cidadãos.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">OWLAB produces policy briefs, syntheses and regulatory improvement proposals. Follow our legislative work, starting with the Citizens' Legislative Initiative.<\u002Fsc-if><\u002Fp>\n          <a href=\"mailto:geral@owlab.pt\" style=\"font-size:13px; font-weight:700; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Acompanhe o nosso trabalho legislativo →<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Follow our legislative work →<\u002Fsc-if><\u002Fa>\n        <\u002Fdiv>\n        <div id=\"participar\" style=\"border:1px solid rgba(26,22,106,0.18); border-radius:4px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <h4 style=\"font-size:19px; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Participar<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Participate<\u002Fsc-if><\u002Fh4>\n          <p style=\"font-size:12.5px; font-weight:700; color:#6B6E74;\"><sc-if value=\"{{ isPt }}\">Qualquer cidadão interessado em contribuir para processos de decisão pública informados.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Any citizen interested in contributing to informed public decision-making.<\u002Fsc-if><\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.55; color:#3A3F43; flex:1;\"><sc-if value=\"{{ isPt }}\">Os Fóruns Cidadãos estão abertos a quem quiser dar a sua opinião, ouvir diferentes perspetivas e votar em propostas em debate. Não é preciso ser especialista.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Citizen Forums are open to anyone who wants to share their view, hear different perspectives and vote on proposals under debate. No expertise required.<\u002Fsc-if><\u002Fp>\n          <a href=\"#\" style=\"font-size:13px; font-weight:700; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Inscreva-se num Fórum Cidadão →<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Register for a Citizen Forum →<\u002Fsc-if><\u002Fa>\n        <\u002Fdiv>\n        <div id=\"associar\" style=\"background:#1A166A; border-radius:4px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <h4 style=\"font-size:19px; color:#E4F2E1;\"><sc-if value=\"{{ isPt }}\">Associar-me<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Become a member<\u002Fsc-if><\u002Fh4>\n          <p style=\"font-size:12.5px; font-weight:700; color:#B9C9B4;\"><sc-if value=\"{{ isPt }}\">Quem quer um vínculo formal e continuado com a OWLAB.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">For those seeking a formal, ongoing bond with OWLAB.<\u002Fsc-if><\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.55; color:#D8E4D5; flex:1;\"><sc-if value=\"{{ isPt }}\">Tornar-se associado é apoiar de forma estável o trabalho da associação e participar na sua vida institucional, nos termos dos Estatutos.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Becoming a member means steadily supporting the association's work and taking part in its institutional life, under the Statutes.<\u002Fsc-if><\u002Fp>\n          <a href=\"#\" style=\"font-size:13px; font-weight:700; color:#E4F2E1;\"><sc-if value=\"{{ isPt }}\">Torne-se associado →<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Become a member →<\u002Fsc-if><\u002Fa>\n        <\u002Fdiv>\n        <div id=\"apoiar\" style=\"border:1px solid rgba(26,22,106,0.18); border-radius:4px; padding:26px; display:flex; flex-direction:column; gap:12px;\">\n          <h4 style=\"font-size:19px; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Apoiar<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Support us<\u002Fsc-if><\u002Fh4>\n          <p style=\"font-size:12.5px; font-weight:700; color:#6B6E74;\"><sc-if value=\"{{ isPt }}\">Quem quer contribuir sem assumir o vínculo formal de associado.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">For those who want to contribute without becoming a formal member.<\u002Fsc-if><\u002Fp>\n          <p style=\"font-size:13.5px; line-height:1.55; color:#3A3F43; flex:1;\"><sc-if value=\"{{ isPt }}\">Pode apoiar através de um donativo, único ou regular, ou disponibilizando recursos, competências ou tempo de voluntariado.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">You can support us through a one-off or regular donation, or by offering resources, skills or volunteer time.<\u002Fsc-if><\u002Fp>\n          <a href=\"#\" style=\"font-size:13px; font-weight:700; color:#1A166A;\"><sc-if value=\"{{ isPt }}\">Faça um donativo →<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Make a donation →<\u002Fsc-if><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- CONTACTOS -->\n  <section id=\"contactos\" data-screen-label=\"Contactos\" style=\"background:#1A166A; color:#E4F2E1; padding:clamp(64px,10vw,120px) clamp(20px,5vw,56px);\">\n    <div data-reveal=\"1\" style=\"max-width:1080px; margin:0 auto; display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:48px; align-items:start; opacity:0; transform:translateY(24px); transition:opacity .7s ease, transform .7s ease;\">\n      <div>\n        <div style=\"font-family:'Six Caps',sans-serif; font-size:22px; letter-spacing:0.14em; color:#B9C9B4; margin-bottom:12px;\">\n          <sc-if value=\"{{ isPt }}\">CONTACTOS<\u002Fsc-if><sc-if value=\"{{ isEn }}\">CONTACT<\u002Fsc-if>\n        <\u002Fdiv>\n        <h2 style=\"font-size:clamp(28px,4vw,40px); margin-bottom:18px;\">\n          <sc-if value=\"{{ isPt }}\">Fale com a OWLAB<\u002Fsc-if><sc-if value=\"{{ isEn }}\">Talk to OWLAB<\u002Fsc-if>\n        <\u002Fh2>\n        <p style=\"font-family:'Barlow Condensed',sans-serif; font-weight:500; font-style:italic; font-size:17px; color:#D8E4D5;\">OWLAB — One Welfare Lab · Portugal<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:22px;\">\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#B9C9B4; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">EMAIL<\u002Fsc-if><sc-if value=\"{{ isEn }}\">EMAIL<\u002Fsc-if><\u002Fdiv>\n          <a href=\"mailto:geral@owlab.pt\" style=\"color:#E4F2E1; font-size:18px; font-weight:600;\">geral@owlab.pt<\u002Fa>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#B9C9B4; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">TELEFONE<\u002Fsc-if><sc-if value=\"{{ isEn }}\">PHONE<\u002Fsc-if><\u002Fdiv>\n          <a href=\"tel:+351912686068\" style=\"color:#E4F2E1; font-size:18px; font-weight:600;\">+351 912 686 068<\u002Fa>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#B9C9B4; margin-bottom:6px;\"><sc-if value=\"{{ isPt }}\">LOCALIZAÇÃO<\u002Fsc-if><sc-if value=\"{{ isEn }}\">LOCATION<\u002Fsc-if><\u002Fdiv>\n          <div style=\"color:#E4F2E1; font-size:18px; font-weight:600;\">Portugal<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:#000000; color:#C9CBCE; padding:40px clamp(20px,5vw,56px); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:20px;\">\n    <div style=\"display:flex; align-items:center; gap:10px;\">\n      <img src=\"4c208e2c-2de3-43f6-99f6-2bb3ad54dccc\" alt=\"OWLAB\" style=\"width:26px; height:26px; border-radius:5px; object-fit:cover;\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif; font-weight:700; color:#E4F2E1;\">OWLAB<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-size:13px;\"><sc-if value=\"{{ isPt }}\">© 2026 OWLAB. Todos os direitos reservados.<\u002Fsc-if><sc-if value=\"{{ isEn }}\">© 2026 OWLAB. All rights reserved.<\u002Fsc-if><\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { lang: 'pt' };\n  componentDidMount() {\n    const els = document.querySelectorAll('[data-reveal=\"1\"]');\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (e.isIntersecting) {\n          e.target.style.opacity = '1';\n          e.target.style.transform = 'translateY(0)';\n          io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.15 });\n    els.forEach((el) => io.observe(el));\n  }\n  renderVals() {\n    return {\n      isPt: this.state.lang === 'pt',\n      isEn: this.state.lang === 'en',\n      toggleLang: () => this.setState(s => ({ lang: s.lang === 'pt' ? 'en' : 'pt' })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
